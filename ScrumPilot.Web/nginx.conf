server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API requests to the backend container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve files directly, fallback to index.html for SPA client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure framework assets are served as static files
    location /_framework/ {
        try_files $uri =404;
    }

    # Static asset caching for common extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf|eot|map|wasm|br|gz)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    include /etc/nginx/mime.types;
}
