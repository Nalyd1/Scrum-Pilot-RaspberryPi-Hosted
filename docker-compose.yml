services:
  api:
    image: ${DOCKER_USERNAME:-scrumpilot}/scrumpilot-api:latest
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SCRUMPILOT_SKIP_SEED=true
      - CONNECTION_STRING=Data Source=/app/data/scrumpilot.db
      - Jwt__Key=${JWT_KEY:-ScrumPilot-Dev-Secret-Key-Replace-Before-Production!2025}
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  web:
    image: ${DOCKER_USERNAME:-scrumpilot}/scrumpilot-web:latest
    ports:
      - "80:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-/}
    depends_on:
      - api
    restart: unless-stopped

  # Watchtower automatically pulls new images and restarts containers
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=false
    restart: unless-stopped

volumes:
  api-data:
