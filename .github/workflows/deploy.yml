name: Build & Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA version tag
        id: version
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ScrumPilot.API/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/scrumpilot-api:${{ steps.version.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/scrumpilot-api:latest

      - name: Build and push Web image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ScrumPilot.Web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/scrumpilot-web:${{ steps.version.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME }}/scrumpilot-web:latest
